name: Docs build check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: cubertgmbh/cuvis_pyil:3.5.0-ubuntu24.04
    steps:
      - name: Install build dependencies
        run: apt-get update -y && apt-get install -y git doxygen graphviz

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Stage cuvis.h for Doxygen
        run: |
          mkdir -p docs/_api_sources
          cp /usr/include/cuvis.h docs/_api_sources/cuvis.h

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync docs deps
        run: uv sync --extra docs

      - name: Build site (strict)
        run: uv run mkdocs build --strict
