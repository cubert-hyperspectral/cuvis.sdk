site_name: Cuvis SDK
site_description: Cubert hyperspectral camera SDK — installers, wrappers, examples.
site_url: https://cubert-hyperspectral.github.io/cuvis.sdk/
repo_url: https://github.com/cubert-hyperspectral/cuvis.sdk
edit_uri: blob/main/docs/

theme:
  name: material
  logo: assets/cubert_icon_light.png
  favicon: assets/cubert_icon_light.png
  palette:
    - media: "(prefers-color-scheme: light)"
      primary: custom
      accent: custom
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: custom
      accent: custom
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.code.annotation

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.details

extra:
  version:
    provider: mike

plugins:
  - search
  - llmstxt:
      markdown_description: |
        Cuvis SDK is the official SDK for Cubert hyperspectral cameras.
        It provides C, C++, and Python APIs for camera control, data acquisition,
        and hyperspectral data processing.
      full_output: llms-full.txt
      sections:
        Installation:
          - installation.md
        Examples:
          - examples/*.md
        API Reference:
          - api/python.md
        Reference:
          - reference.md
  - macros:
      module_name: tools/docs_macros
  - mkdoxy:
      projects:
        cuvis_c:
          src-dirs: docs/_api_sources
          full-doc: true
          doxy-cfg:
            FILE_PATTERNS: "*.h"
            OPTIMIZE_OUTPUT_FOR_C: "YES"
            EXTRACT_ALL: "YES"
            GENERATE_HTML: "NO"
            GENERATE_XML: "YES"
            PROJECT_NAME: "Cuvis C API"
        cuvis_cpp:
          src-dirs: cuvis.cpp/interface
          full-doc: true
          doxy-cfg:
            FILE_PATTERNS: "*.hpp"
            EXTRACT_ALL: "YES"
            GENERATE_HTML: "NO"
            GENERATE_XML: "YES"
            PROJECT_NAME: "Cuvis C++ API"
  - mkdocstrings:
      handlers:
        python:
          paths: [cuvis.python]
          options:
            allow_inspection: false
            show_source: false
            show_bases: true
            show_root_heading: true
            docstring_style: google

extra_javascript:
  - javascripts/sdk-installer.js

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Installation: installation.md
  - Examples:
    - Overview: examples/index.md
    - 1 – Take Snapshot: examples/example_1_take_snapshot.md
    - 2 – Load Measurement: examples/example_2_load_measurement.md
    - 3 – Reprocess: examples/example_3_reprocess.md
    - 4 – Exporters: examples/example_4_exporters.md
    - 5 – Record Video: examples/example_5_record_video.md
  - API Reference:
    - C API: cuvis_c/modules.md
    - C++ API: cuvis_cpp/annotated.md
    - Python API: api/python.md
  - Reference: reference.md
