[project]
name = "cuvis-sdk-docs"
version = "0.1.0"
description = "Cuvis SDK documentation site"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-macros-plugin>=1.0.0",
    "mkdocs-llmstxt>=0.2",
    "cuvis-sdk-url",
]

[tool.uv]
package = false

[tool.uv.sources]
cuvis-sdk-url = { path = "python", editable = true }
